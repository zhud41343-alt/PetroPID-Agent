  <text x="44" y="438" fill="#334155" font-size="11.5">• 自动重试 + 幂等工具缓存：故障恢复 100%，零重复执行</text>
  <text x="44" y="462" fill="#334155" font-size="11.5">• DeepSeek 实时推理 + 离线规则无缝降级，零单点卡死</text>
  <text x="44" y="486" fill="#64748b" font-size="11">• 144 次原始消融记录独立复算（recompute_ablation.py）</text>

