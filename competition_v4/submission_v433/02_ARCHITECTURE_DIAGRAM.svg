  <text x="330" y="182" text-anchor="middle" fill="#64748b" font-size="10" font-family="Consolas, monospace">DiagnosisAgent</text>
  <text x="330" y="204" text-anchor="middle" fill="#334155" font-size="10.5">OI / IAE / Harris</text>
  <text x="330" y="221" text-anchor="middle" fill="#334155" font-size="10.5">PV-OP 粘滞 SI</text>
  <text x="330" y="238" text-anchor="middle" fill="#334155" font-size="10.5">OWL 规则溯源</text>

