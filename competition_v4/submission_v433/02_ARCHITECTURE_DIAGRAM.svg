  <text x="480" y="182" text-anchor="middle" fill="#64748b" font-size="10" font-family="Consolas, monospace">IdentAgent</text>
  <text x="480" y="204" text-anchor="middle" fill="#334155" font-size="10.5">FOPDT (K, τ, θ)</text>
  <text x="480" y="221" text-anchor="middle" fill="#334155" font-size="10.5">65% 训练 / 35% 留出</text>
  <text x="480" y="238" text-anchor="middle" fill="#b45309" font-size="10.5" font-weight="700">C-000 置信门控</text>

