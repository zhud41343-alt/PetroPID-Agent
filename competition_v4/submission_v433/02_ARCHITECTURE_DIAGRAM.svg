  <text x="124" y="180" text-anchor="middle" fill="#64748b" font-size="10.5">5 大装置 × 6 类典型工况</text>
  <rect x="42" y="202" width="164" height="48" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="124" y="222" text-anchor="middle" fill="#1e293b" font-size="12" font-weight="700">40 样本 SOPDT 泛化集</text>
  <text x="124" y="240" text-anchor="middle" fill="#64748b" font-size="10.5">含 8 例零调参严格留出集</text>
  <rect x="42" y="262" width="164" height="54" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="124" y="282" text-anchor="middle" fill="#1e293b" font-size="12" font-weight="700">压力沙盒 &amp; CSV 上传</text>
  <text x="124" y="300" text-anchor="middle" fill="#64748b" font-size="10.5">sp/pv/op 脱敏离线时序</text>

