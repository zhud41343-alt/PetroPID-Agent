  <!-- Top Header Banner -->
  <rect x="0" y="0" width="1280" height="68" fill="#111827"/>
  <rect x="24" y="16" width="44" height="36" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="46" y="40" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Consolas, monospace">PID</text>
  <text x="84" y="34" fill="#f8fafc" font-size="19" font-weight="700">PetroPID-Agent V4.3.3 · 石化控制回路多智能体诊断与安全整定工程架构</text>
  <text x="84" y="54" fill="#94a3b8" font-size="12">参考 ISA-101 高性能 HMI 设计原则 · 确定性数学/安全内核 + 紧凑状态黑板 + 独立 9 态 Fail-Closed 审批引擎</text>
  <rect x="1030" y="19" width="226" height="30" rx="4" fill="#451a03" stroke="#d97706" stroke-width="1.2"/>
  <text x="1143" y="39" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="700" font-family="Consolas, monospace">SIMULATION ONLY · NO DCS WRITE</text>

