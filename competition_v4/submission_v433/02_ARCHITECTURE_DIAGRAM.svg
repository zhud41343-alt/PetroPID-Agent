  <text x="52" y="594" fill="#cbd5e1" font-size="12" font-family="Consolas, monospace">30 回路基准: 诊断 30/30 (100%) | 保守安全 30/30 (100%) | 独立精确匹配 24/30 (80.0%) | 危险误放行 0/19 (0.0%)</text>
  <text x="52" y="618" fill="#cbd5e1" font-size="12" font-family="Consolas, monospace">40 SOPDT 泛化: 全量 38/40 (95.0%) | 严格留出集 OOD-33..40 7/8 (87.5%) | 错误推荐 0/24 (95%单侧上界 ≤11.73%)</text>
