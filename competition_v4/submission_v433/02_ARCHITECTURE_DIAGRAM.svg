  <rect x="714" y="144" width="132" height="114" rx="4" fill="#f8fafc" stroke="#046c4e" stroke-width="1.5"/>
  <text x="780" y="165" text-anchor="middle" fill="#046c4e" font-size="12" font-weight="700">④ 安全校验</text>
