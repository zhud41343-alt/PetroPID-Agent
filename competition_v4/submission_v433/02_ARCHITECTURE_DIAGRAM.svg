  <rect x="564" y="144" width="132" height="114" rx="4" fill="#f8fafc" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="630" y="165" text-anchor="middle" fill="#1d4ed8" font-size="12" font-weight="700">③ 整定优化</text>
  <text x="630" y="182" text-anchor="middle" fill="#64748b" font-size="10" font-family="Consolas, monospace">TuningAgent</text>
