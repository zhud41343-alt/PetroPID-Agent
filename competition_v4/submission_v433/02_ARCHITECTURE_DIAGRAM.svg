  <text x="1144" y="305" text-anchor="middle" fill="#b45309" font-size="10" font-family="Consolas, monospace">deployment_authorized=false</text>

  <line x1="1008" y1="201" x2="1032" y2="201" stroke="#046c4e" stroke-width="2" marker-end="url(#arrow-green)"/>

