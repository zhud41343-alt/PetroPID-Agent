  <text x="462" y="414" fill="#334155" font-size="11.5">• OWL 故障与约束本体：116 条 RDF 三元组自动校验</text>
  <text x="462" y="438" fill="#334155" font-size="11.5">• SQL 审计存证模型：7 张核心表 + 22 条领域知识三元组</text>
