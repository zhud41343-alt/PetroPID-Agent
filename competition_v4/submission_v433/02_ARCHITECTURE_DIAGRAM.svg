  <text x="629" y="309" text-anchor="middle" fill="#b91c1c" font-size="10.5">一律阻断参数推荐并保持原 DCS 参数，绝不降级放行危险参数（30 回路保守安全决策 100% · 危险误放行 0%）</text>

