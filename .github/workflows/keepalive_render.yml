name: Keep Render Demo Warm (Judging Window)

on:
  schedule:
    # Ping every 10 minutes to prevent Render Free 15-min idle sleep during judging
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake and verify /healthz endpoint
        run: |
          status=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 65 "https://petropid-agent.onrender.com/healthz")
          echo "HTTP_STATUS=$status"
          cat /tmp/health.json
          test "$status" -eq 200
